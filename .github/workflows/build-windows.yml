name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Create Windows Skeleton
        run: flutter create . --platforms=windows --project-name=fleet_fluid_tracker

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Build Output into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Lubrication-Chart-Windows.zip"

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-Windows-Desktop
          path: Lubrication-Chart-Windows.zip
