name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      # নিশ্চিতভাবে একটি স্থায়ী কি তৈরি করা (একই ডিরেক্টরিতে)
      - name: Generate Local Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/my_permanent_key.jks \
            -alias permanentkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 20000 \
            -storepass "AtanuGhoshBro2026" \
            -keypass "AtanuGhoshBro2026" \
            -dname "CN=LubricationChart, OU=Fleet, O=BRO, C=IN"

      # সাধারণ রিলিজ বিল্ড
      - name: Build Optimized APK
        run: flutter build apk --release --split-per-abi

      # নিশ্চিতভাবে ওই নির্দিষ্ট সার্টিফিকেট দিয়ে সাইন করা
      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks android/app/my_permanent_key.jks \
            --ks-pass pass:AtanuGhoshBro2026 \
            --ks-key-alias permanentkey \
            --key-pass pass:AtanuGhoshBro2026 \
            --out Lubrication-Chart.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: Lubrication-Chart.apk
