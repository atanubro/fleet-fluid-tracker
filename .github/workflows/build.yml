name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      # ফিক্সড কীস্টোর ডিকোড করা (যাতে প্রতিবার একই সার্টিফিকেট থাকে)
      - name: Setup Constant Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storepass brokey123 -alias brokey -keypass brokey123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LubricationChart, O=BRO, C=IN" \
            -startdate "2026/01/01 00:00:00"

          cat << 'EOF' > android/key.properties
          storePassword=brokey123
          keyPassword=brokey123
          keyAlias=brokey
          storeFile=upload-keystore.jks
          EOF

      # রিলিজ সাইনিং কনফিগার করে ছোট সাইজের APK তৈরি
      - name: Build Optimized Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: build/app/outputs/flutter-apk/app-release.apk
