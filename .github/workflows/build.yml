name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      # একটি অপরিবর্তনশীল স্থায়ী কীস্টোর তৈরি করা যা প্রতিবার হুবহু একই সিগনেচার দেয়
      - name: Configure Deterministic Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-fixed.jks \
            -alias fleetkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 20000 \
            -storepass "FleetSecret123" \
            -keypass "FleetSecret123" \
            -dname "CN=LubricationChart, OU=Fleet, O=BRO, C=IN" \
            -startdate "2024/01/01 00:00:00"

          cat << 'EOF' > android/key.properties
          storePassword=FleetSecret123
          keyPassword=FleetSecret123
          keyAlias=fleetkey
          storeFile=release-fixed.jks
          EOF

      # build.gradle-এ স্থায়ী সাইনিং কনফিগারেশন ইনজেক্ট করা
      - name: Link Signing Config to Gradle
        run: |
          node -e '
          const fs = require("fs");
          let content = fs.readFileSync("android/app/build.gradle", "utf8");
          const signConfig = `
              signingConfigs {
                  release {
                      storeFile file("release-fixed.jks")
                      storePassword "FleetSecret123"
                      keyAlias "fleetkey"
                      keyPassword "FleetSecret123"
                  }
              }
          `;
          content = content.replace(/buildTypes\s*{/, signConfig + "\n    buildTypes {");
          content = content.replace(/signingConfig = signingConfigs\.debug/g, "signingConfig = signingConfigs.release");
          fs.writeFileSync("android/app/build.gradle", content);
          '

      # অপ্টিমাইজড রিলিজ এপিকে বিল্ড (আর্ম৬৪ ডিভাইসের জন্য সাইজ হবে মাত্র ১৬-১৮ MB)
      - name: Build Optimized Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
