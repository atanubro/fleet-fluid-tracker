name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      # ফিক্সড কীস্টোর তৈরি
      - name: Generate Constant Keystore
        run: |
          keytool -genkey -v -keystore android/app/fixed_keystore.jks -storepass secretKey123 -alias appKey -keypass secretKey123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LubricationChart, OU=Fleet, O=BRO, L=Pithoragarh, S=UK, C=IN"

      # গ্র্যাডলে সরাসরি ফিক্সড সাইনিং যুক্ত করা
      - name: Link Keystore to Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('fixed_keystore.jks')
                      storePassword 'secretKey123'
                      keyAlias 'appKey'
                      keyPassword 'secretKey123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: build/app/outputs/flutter-apk/app-release.apk
