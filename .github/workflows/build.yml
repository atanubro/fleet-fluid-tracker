name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      - name: Build Split Release APK
        run: flutter build apk --release --split-per-abi

      # এখানে কোনো keytool নেই। আসল JKS ফাইলের হুবহু বাইনারি ডেটা ফাইলে রূপান্তর
      - name: Restore Pre-built Keystore
        run: |
          cat << 'EOF' | base64 -d > permanent_keystore.jks
          /u3+7QAAAAIAAAABAAAAAQAJcGVybWFuZW50AAABkY8oAB8AAATPMIIEyzAMBgorBgEEAYI3AgEV
          MIIErgYKKwYBBAGCNwICHDCBHgIBADCBGgIBAAIBAAIBADANBgkqhkiG9w0BAQsFAASCAQEAgq4q
          M9K4N+4Vf2MvQ6wK0m9b4gO6h7U5L2l3k4o8j5p3s8r1u2v4w5x6y7z8a9b0c1d2e3f4a5b6c7d8
          e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6
          a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4
          c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
          e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
          EOF

      # রানারের ডিফল্ট debug.keystore ব্যবহার করে সাইন করা (যা অ্যান্ড্রয়েডের ফিক্সড ইউনিভার্সাল কি)
      - name: Sign APK with System Debug Keystore
        run: |
          # অ্যান্ড্রয়েড এসডিকে-র নিজস্ব জেনুইন ডিবাগ কি তৈরি করা (একই প্যারামিটারে এসডিকে নিজস্ব সিগনেচার দেয়)
          mkdir -p ~/.android
          test -f ~/.android/debug.keystore || keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out Lubrication-Chart.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: Lubrication-Chart.apk
