name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      - name: Build Base APK
        run: flutter build apk --release

      # ফিক্সড সার্টিফিকেট দিয়ে APK স্থায়ীভাবে সাইন করা (গ্র্যাডল স্পর্শ না করে)
      - name: Sign APK with Constant Certificate
        run: |
          keytool -genkey -v -keystore constant.jks -storepass brokey123 -alias brofleet -keypass brokey123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LubricationChart, OU=Fleet, O=BRO, C=IN"
          
          # Android SDK-র apksigner দিয়ে সাইন করা
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks constant.jks --ks-pass pass:brokey123 --ks-key-alias brofleet --key-pass pass:brokey123 --out Lubrication-Chart.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: Lubrication-Chart.apk
