name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      # স্বাভাবিক নির্ভরযোগ্য রিলিজ বিল্ড (কোনও স্ক্রিপ্ট দিয়ে গ্র্যাডল পরিবর্তন না করে)
      - name: Build Split Release APK
        run: flutter build apk --release --split-per-abi

      # ফিক্সড সাইনিং কি তৈরি ও সরাসরি apksigner দিয়ে সাইন করা
      - name: Sign APK Deterministically
        run: |
          keytool -genkeypair -v \
            -keystore permanent.jks \
            -alias fleetkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 20000 \
            -storepass "FleetSecret123" \
            -keypass "FleetSecret123" \
            -dname "CN=LubricationChart, OU=Fleet, O=BRO, C=IN" \
            -startdate "2024/01/01 00:00:00"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks permanent.jks --ks-pass pass:FleetSecret123 --ks-key-alias fleetkey --key-pass pass:FleetSecret123 --out Lubrication-Chart.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: Lubrication-Chart.apk
