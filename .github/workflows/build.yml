name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Android skeleton
        run: flutter create . --platforms=android --project-name=fleet_fluid_tracker

      - name: Set App Name to Lubrication Chart
        run: |
          sed -i 's/android:label="fleet_fluid_tracker"/android:label="Lubrication Chart"/' android/app/src/main/AndroidManifest.xml

      - name: Add Internet Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml

      - name: Setup App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ -f "app_icon.jpg" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              convert app_icon.jpg -resize 192x192 "$dir/ic_launcher.png"
            done
          fi

      # ফিক্সড সাইনিং কি ও কনফিগারেশন সেটআপ (যাতে প্রতি বিল্ডে একই সার্টিফিকেট বজায় থাকে)
      - name: Setup Fixed Release Signing
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks -storepass secret123 -alias upload -keypass secret123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BROFleet, OU=Fleet, O=BRO, L=Pithoragarh, S=UK, C=IN"
          
          cat << 'EOF' > update_signing.py
          with open('android/app/build.gradle', 'r') as f:
              gradle = f.read()

          signing_def = """
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword 'secret123'
                      keyAlias 'upload'
                      keyPassword 'secret123'
                  }
              }
          """
          
          # Inject signingConfigs before buildTypes
          gradle = gradle.replace('buildTypes {', signing_def + '\n    buildTypes {')
          # Point release buildType to signingConfigs.release
          gradle = gradle.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig = signingConfigs.release')
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(gradle)
          EOF
          python3 update_signing.py

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lubrication-Chart-APK
          path: build/app/outputs/flutter-apk/app-release.apk
